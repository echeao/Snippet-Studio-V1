<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snippet Studio Code Editor</title>
    <link rel="stylesheet" href="editor.css">
    <script src="editor.js" defer></script>
</head>
<body>
    <!-- 纯本地离线代码编辑器容器结构 -->
    <div id="editor-wrapper">
        <div id="gutter"></div>
        <div id="textarea-container">
            <textarea id="code-input" spellcheck="false" autocomplete="off" autocapitalize="off" autofocus></textarea>
        </div>
    </div>
</body>
</html>
